<!doctype html>
<!--
  Assumptions:
  - This prototype chooses option A: Windows frameless chrome with menu items merged into the titlebar.
  - The edit / split / preview icons have no surrounding segmented-control border.
  - Active view state is shown by accent color plus a small underline, not by an outer frame.
  - This is a visual prototype only; it does not change production Tauri/React code.

  Form source:
  - Prism is a writing tool, so the chrome should stay thin and quiet.
  - View mode is a document-view control, so it sits before window controls but visually remains lighter than them.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prism Windows Option A Borderless View Modes</title>
  <style>
    :root {
      --app-bg: #ffffff;
      --chrome-bg: #fbfaf8;
      --sidebar-bg: #f6f6f5;
      --panel-bg: #eeeeed;
      --hover-bg: #ececea;
      --hairline: rgba(0, 0, 0, 0.075);
      --hairline-soft: rgba(0, 0, 0, 0.045);
      --text: #171717;
      --text-soft: #626262;
      --text-faint: #8f8f8f;
      --accent: #7f42bf;
      --accent-soft: rgba(127, 66, 191, 0.11);
      --green: #159164;
      --warm: #8a5b14;
      --sans: Inter, "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --shadow-window: 0 18px 50px rgba(33, 28, 20, 0.18), 0 4px 18px rgba(33, 28, 20, 0.12);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-width: 900px;
      min-height: 620px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.86), rgba(246,243,239,0.9)),
        #ebe7df;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .window {
      width: min(1100px, calc(100vw - 32px));
      height: min(760px, calc(100vh - 32px));
      min-width: 900px;
      min-height: 620px;
      display: grid;
      grid-template-rows: 38px 1fr 26px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      background: var(--app-bg);
      box-shadow: var(--shadow-window);
    }

    .titlebar {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      height: 38px;
      background: var(--chrome-bg);
      border-bottom: 1px solid var(--hairline);
      user-select: none;
    }

    .left-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: 100%;
      padding-left: 12px;
      padding-right: 12px;
      flex: 0 1 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      flex: 0 0 auto;
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 520;
      letter-spacing: 0;
    }

    .brand img {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .titlebar-menu {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    .menu-item {
      height: 21px;
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      padding: 0 7px;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      line-height: 21px;
      letter-spacing: 0;
      white-space: nowrap;
      transition: background 120ms var(--ease), color 120ms var(--ease);
    }

    .menu-item:hover,
    .menu-item.active {
      background: var(--hover-bg);
    }

    .center-title {
      position: absolute;
      left: 50%;
      top: 0;
      height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 280px;
      transform: translateX(-50%);
      color: var(--text);
      font-size: 12px;
      font-weight: 520;
      letter-spacing: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    .save-dot {
      width: 6px;
      height: 6px;
      display: inline-block;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(21, 145, 100, 0.08);
    }

    .drag-region {
      min-width: 72px;
      height: 100%;
      flex: 1 1 auto;
    }

    .right-cluster {
      display: inline-flex;
      align-items: center;
      height: 100%;
      margin-left: auto;
      flex: 0 0 auto;
    }

    .view-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      margin-right: 12px;
    }

    .view-btn {
      position: relative;
      width: 26px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--text-faint);
      cursor: default;
      transition: background 120ms var(--ease), color 120ms var(--ease), transform 120ms var(--ease);
    }

    .view-btn:hover {
      color: var(--text);
      background: var(--hover-bg);
    }

    .view-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .view-btn.active::after {
      position: absolute;
      right: 8px;
      bottom: 2px;
      left: 8px;
      height: 2px;
      content: "";
      border-radius: 99px;
      background: currentColor;
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transform: translateY(-0.5px);
    }

    .chrome-divider {
      width: 1px;
      height: 18px;
      margin-right: 8px;
      background: var(--hairline);
    }

    .window-controls {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      height: 38px;
      flex: 0 0 auto;
    }

    .win-btn {
      display: grid;
      place-items: center;
      color: #5f5f5f;
      transition: background 120ms var(--ease), color 120ms var(--ease);
    }

    .win-btn:hover {
      background: #ececea;
      color: #111;
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
      background: var(--app-bg);
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--hairline);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px 6px;
    }

    .tab {
      height: 30px;
      border-radius: 7px;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 520;
    }

    .tab.active {
      background: #dfdfdd;
      color: var(--text);
    }

    .files {
      padding: 9px 16px 16px;
    }

    .file {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 7px;
      color: var(--text);
      background: var(--panel-bg);
      font-size: 13px;
      text-align: left;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .outline-hint {
      margin-top: 16px;
      padding-left: 12px;
      color: #ababab;
      font-size: 12px;
    }

    .document {
      display: grid;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }

    .document[data-mode="split"] {
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
    }

    .document[data-mode="edit"],
    .document[data-mode="preview"] {
      grid-template-columns: 1fr;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--app-bg);
    }

    .editor-pane {
      padding: 29px 30px 32px;
    }

    .preview-pane {
      padding: 34px 42px 32px;
      border-left: 1px solid var(--hairline);
      background: #fffdfa;
    }

    .document[data-mode="edit"] .preview-pane,
    .document[data-mode="preview"] .editor-pane {
      display: none;
    }

    .document[data-mode="preview"] .preview-pane {
      border-left: 0;
      padding-left: min(9vw, 96px);
      padding-right: min(9vw, 96px);
    }

    .editor {
      max-width: 720px;
      color: #101010;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.78;
      letter-spacing: 0;
    }

    .line {
      min-height: 28px;
      white-space: pre-wrap;
    }

    .hash,
    .md-accent {
      color: var(--accent);
    }

    .task {
      color: var(--warm);
    }

    .cursor {
      display: inline-block;
      width: 1px;
      height: 20px;
      margin-left: 1px;
      transform: translateY(4px);
      background: #171717;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .preview {
      max-width: 720px;
      color: #1b1b1b;
      font-family: "TsangerJinKai02", "Microsoft YaHei UI", "Microsoft YaHei", serif;
      font-size: 16px;
      line-height: 1.85;
      letter-spacing: 0.3px;
    }

    .preview h1 {
      margin-bottom: 26px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .preview p {
      margin-bottom: 22px;
    }

    .preview .task-preview {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #242424;
      font-family: var(--sans);
      font-size: 14px;
    }

    .checkbox {
      width: 13px;
      height: 13px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-size: 11px;
      line-height: 1;
    }

    .statusbar {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      min-width: 0;
      height: 26px;
      border-top: 1px solid var(--hairline);
      background: var(--chrome-bg);
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0;
      user-select: none;
    }

    .status-sidebar {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      align-items: center;
      height: 100%;
      border-right: 1px solid var(--hairline);
    }

    .status-plus,
    .status-grid {
      display: grid;
      place-items: center;
      height: 100%;
      color: #8e8e8e;
      font-size: 16px;
    }

    .status-grid {
      font-size: 14px;
    }

    .workspace-name {
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      padding-right: 10px;
      gap: 10px;
    }

    .stats {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #676767;
    }

    .doc-kind {
      height: 18px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background: rgba(255,255,255,0.6);
    }

    .tiny-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #858585;
    }

    .tiny-icon svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
    }

    @media (max-width: 1060px) {
      .center-title {
        display: none;
      }

      .menu-item {
        padding-inline: 5px;
      }
    }

    @media (max-width: 980px) {
      .window {
        width: 100vw;
        height: 100vh;
        min-width: 900px;
        min-height: 620px;
        border-radius: 0;
      }
    }
  </style>
</head>

            <div class="line"><span class="cursor"></span></div>
          </div>
        </section>
        <section class="pane preview-pane" aria-label="预览">
          <article class="preview">
            <h1>复杂路径 Smoke</h1>
            <p>中文路径、空格和括号。</p>
            <p class="task-preview"><span class="checkbox">✓</span><span>save path</span></p>
          </article>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <div class="status-sidebar">
        <span class="status-plus">+</span>
        <span class="workspace-name">路径 Smoke（中文 空格）</span>
        <span class="status-grid">▪</span>
      </div>
      <div class="status-main">
        <span class="stats">16 字 · 7:1</span>
        <span class="doc-kind">Markdown 文档</span>
        <span>排版</span>
        <span class="tiny-icon" aria-hidden="true">
          <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="3.1"/></svg>
        </span>
        <span class="tiny-icon" aria-hidden="true">
          <svg viewBox="0 0 12 12"><path d="M6 2v7M3.6 6.7 6 9.1l2.4-2.4M2.4 10h7.2"/></svg>
        </span>
      </div>
    </footer>
  </div>

  <script>
    const documentPane = document.querySelector('#document');
    const modeButtons = Array.from(document.querySelectorAll('[data-mode-button]'));

    modeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.getAttribute('data-mode-button');
        documentPane.setAttribute('data-mode', mode);
        modeButtons.forEach((item) => {
          item.classList.toggle('active', item === button);
        });
      });
    });
  </script>
</body>
</html>
