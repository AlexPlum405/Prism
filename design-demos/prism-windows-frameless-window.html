<!doctype html>
<!--
  Assumptions:
  - Windows 版采用完全自绘无边框窗口：Tauri 关闭 native decorations / native menu，只保留一套 app chrome。
  - 视图模式 edit / split / preview 仍是标题栏右上角主入口，但不再放在文件名左侧。
  - 菜单栏保留中文 app menu，作为自绘第二行；顶部总高度从截图里的四层压到两层。
  - 默认展示 split，三个图标可点击切换，用来检查位置和状态反馈。

  Reasoning:
  - Windows 用户熟悉右上窗口控制，因此控制按钮仍贴右侧边缘。
  - ViewModeSwitch 是文档视图级操作，放在窗口控制按钮左侧，比放到左侧标题簇更符合 CONTEXT.md。
  - 中段留作 drag region，避免图标组、菜单项和窗口按钮抢拖拽命中区域。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prism Windows Frameless Window Prototype</title>
  <style>
    :root {
      --app-bg: #ffffff;
      --chrome-bg: #fbfaf8;
      --sidebar-bg: #f6f6f5;
      --panel-bg: #f1f1f0;
      --hover-bg: #ececea;
      --hairline: rgba(0, 0, 0, 0.075);
      --hairline-soft: rgba(0, 0, 0, 0.045);
      --text: #171717;
      --text-soft: #626262;
      --text-faint: #8f8f8f;
      --accent: #7f42bf;
      --accent-soft: rgba(127, 66, 191, 0.12);
      --green: #159164;
      --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      --sans: Inter, "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      --shadow-window: 0 18px 50px rgba(33, 28, 20, 0.18), 0 4px 18px rgba(33, 28, 20, 0.12);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-width: 900px;
      min-height: 620px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.86), rgba(246,243,239,0.9)),
        #ebe7df;
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button {
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    .window {
      width: min(1100px, calc(100vw - 32px));
      height: min(760px, calc(100vh - 32px));
      min-width: 900px;
      min-height: 620px;
      display: grid;
      grid-template-rows: 34px 26px 1fr 26px;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      background: var(--app-bg);
      box-shadow: var(--shadow-window);
    }

    .titlebar {
      display: flex;
      align-items: center;
      height: 34px;
      background: var(--chrome-bg);
      border-bottom: 1px solid var(--hairline-soft);
      user-select: none;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 286px;
      max-width: 440px;
      height: 100%;
      padding: 0 10px 0 12px;
      color: var(--text);
      overflow: hidden;
    }

    .app-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      border-radius: 4px;
      image-rendering: auto;
    }

    .app-name {
      font-size: 12px;
      font-weight: 520;
      letter-spacing: 0;
      color: var(--text-soft);
    }

    .title-divider {
      width: 1px;
      height: 14px;
      flex: 0 0 auto;
      background: var(--hairline);
    }

    .doc-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 520;
      letter-spacing: 0;
      color: var(--text);
    }

    .save-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 99px;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(21, 145, 100, 0.08);
    }

    .drag-region {
      height: 100%;
      min-width: 64px;
      flex: 1 1 auto;
    }

    .view-switch {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      height: 26px;
      padding: 2px;
      margin-right: 12px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.78);
    }

    .view-btn {
      width: 25px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: var(--text-faint);
      cursor: default;
      transition: background 120ms var(--ease), color 120ms var(--ease);
    }

    .view-btn:hover {
      color: var(--text);
      background: var(--hover-bg);
    }

    .view-btn.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .view-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      transform: translateY(0.5px);
    }

    .chrome-separator {
      width: 1px;
      height: 18px;
      margin-right: 8px;
      background: var(--hairline);
    }

    .window-controls {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      height: 34px;
      flex: 0 0 auto;
    }

    .win-btn {
      display: grid;
      place-items: center;
      color: #5f5f5f;
      transition: background 120ms var(--ease), color 120ms var(--ease);
    }

    .win-btn:hover {
      background: #ececea;
      color: #111;
    }

    .win-btn.close:hover {
      background: #e81123;
      color: #fff;
    }

    .win-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menubar {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 26px;
      padding: 0 8px;
      background: var(--chrome-bg);
      border-bottom: 1px solid var(--hairline);
      user-select: none;
    }

    .menu-item {
      height: 20px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      line-height: 20px;
      letter-spacing: 0;
    }

    .menu-item:hover,
    .menu-item.active {
      background: var(--hover-bg);
    }

    .workspace {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 0;
      background: var(--app-bg);
    }

    .sidebar {
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--hairline);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px 16px 6px;
    }

    .tab {
      height: 30px;
      border-radius: 7px;
      color: var(--text-soft);
      font-size: 13px;
      font-weight: 520;
    }

    .tab.active {
      background: #dfdfdd;
      color: var(--text);
    }

    .files {
      padding: 9px 16px 16px;
    }

    .file {
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-radius: 7px;
      color: var(--text);
      background: #eeeeed;
      font-size: 13px;
      text-align: left;
      letter-spacing: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .outline-hint {
      margin-top: 16px;
      padding-left: 12px;
      color: #ababab;
      font-size: 12px;
    }

    .document {
      display: grid;
      min-width: 0;
      min-height: 0;
      background: #fff;
    }

    .document[data-mode="split"] {
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
    }

    .document[data-mode="edit"],
    .document[data-mode="preview"] {
      grid-template-columns: 1fr;
    }

    .pane {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--app-bg);
    }

    .editor-pane {
      padding: 26px 30px 32px;
    }

    .preview-pane {
      padding: 31px 42px 32px;
      border-left: 1px solid var(--hairline);
      background: #fffdfa;
    }

    .document[data-mode="edit"] .preview-pane,
    .document[data-mode="preview"] .editor-pane {
      display: none;
    }

    .document[data-mode="preview"] .preview-pane {
      border-left: 0;
      padding-left: min(9vw, 96px);
      padding-right: min(9vw, 96px);
    }

    .editor {
      max-width: 720px;
      color: #101010;
      font-family: var(--mono);
      font-size: 15px;
      line-height: 1.78;
      letter-spacing: 0;
    }

    .line {
      min-height: 28px;
      white-space: pre-wrap;
    }

    .hash,
    .md-accent {
      color: var(--accent);
    }

    .task {
      color: #8a5b14;
    }

    .cursor {
      display: inline-block;
      width: 1px;
      height: 20px;
      margin-left: 1px;
      transform: translateY(4px);
      background: #171717;
      animation: blink 1.1s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .preview {
      max-width: 720px;
      color: #1b1b1b;
      font-family: "TsangerJinKai02", "Microsoft YaHei UI", "Microsoft YaHei", serif;
      font-size: 16px;
      line-height: 1.85;
      letter-spacing: 0.3px;
    }

    .preview h1 {
      margin-bottom: 26px;
      color: var(--accent);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .preview p {
      margin-bottom: 22px;
    }

    .preview .task-preview {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #242424;
      font-family: var(--sans);
      font-size: 14px;
    }

    .checkbox {
      width: 13px;
      height: 13px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-size: 11px;
      line-height: 1;
    }

    .statusbar {
      display: grid;
      grid-template-columns: 280px 1fr;
      align-items: center;
      min-width: 0;
      height: 26px;
      border-top: 1px solid var(--hairline);
      background: var(--chrome-bg);
      color: var(--text-faint);
      font-size: 11px;
      letter-spacing: 0;
      user-select: none;
    }

    .status-sidebar {
      display: grid;
      grid-template-columns: 28px 1fr 28px;
      align-items: center;
      height: 100%;
      border-right: 1px solid var(--hairline);
    }

    .status-plus,
    .status-grid {
      display: grid;
      place-items: center;
      height: 100%;
      color: #8e8e8e;
      font-size: 16px;
    }

    .status-grid {
      font-size: 14px;
    }

    .workspace-name {
      overflow: hidden;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      padding-right: 10px;
      gap: 10px;
    }

    .stats {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #676767;
    }

    .doc-kind {
      height: 18px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border: 1px solid var(--hairline);
      border-radius: 7px;
      background: rgba(255,255,255,0.6);
    }

    .tiny-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #858585;
    }

    .tiny-icon svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
    }

    @media (max-width: 980px) {
      .window {
        width: 100vw;
        height: 100vh;
        min-width: 900px;
        min-height: 620px;
        border-radius: 0;
      }

      .identity {
        min-width: 250px;
      }
    }
  </style>
</head>

  <script>
    const documentPane = document.querySelector('#document');
    const modeButtons = Array.from(document.querySelectorAll('[data-mode-button]'));

    modeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const mode = button.getAttribute('data-mode-button');
        documentPane.setAttribute('data-mode', mode);
        modeButtons.forEach((item) => {
          item.classList.toggle('active', item === button);
        });
      });
    });
  </script>
